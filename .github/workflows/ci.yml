name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.runner }} ${{ matrix.cc }}${{ matrix.sanitize == 'ON' && ' asan+ubsan' || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
        cc: [gcc, clang]
        sanitize: [OFF]
        include:
          - runner: ubuntu-24.04
            cc: clang
            sanitize: ON
    steps:
      - uses: actions/checkout@v4
      - name: Kernel
        run: uname -a; cat /proc/sys/kernel/seccomp/actions_avail
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DSBX_SANITIZE=${{ matrix.sanitize }}
          cmake --build build -j
      - name: Test
        env:
          # LeakSanitizer stops the world with ptrace, which the lockdown refuses.
          ASAN_OPTIONS: detect_leaks=0
        run: TMPDIR="$RUNNER_TEMP" ./build/sbx_test

  fuzz:
    # The broker request path under clang's libFuzzer + ASan/UBSan (review finding A-09).
    name: broker fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the clang runtime (libFuzzer + ASan)
        run: |
          ver=$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -1)
          sudo apt-get update
          sudo apt-get install -y "libclang-rt-${ver}-dev" || sudo apt-get install -y libclang-rt-dev
      - name: Build the fuzz target
        run: |
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DSBX_FUZZ=ON -DSBX_TESTS=OFF
          cmake --build build-fuzz --target fuzz_broker -j
      - name: Fuzz the request path briefly
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          # The corpus holds the regression seeds (e.g. the INT32_MIN learn record the fuzzer found);
          # libFuzzer replays them first, then explores, so a fixed crash can never silently return.
          TMPDIR="$RUNNER_TEMP" ./build-fuzz/fuzz_broker -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1 tests/fuzz_corpus

  linux-arm64:
    # Arm runners are free for public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j
      - name: Test
        run: TMPDIR="$RUNNER_TEMP" ./build/sbx_test

  windows:
    # The Windows backend: an AppContainer and job object at spawn, an explicit broker (docs/design.md, "Windows").
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows version
        run: cmd /c ver
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build --config Release
      - name: Test
        run: .\build\Release\sbx_test_win.exe

  android-build:
    # Compiles, with its tests, for the two Android ABIs that ship; the x86_64 build also runs on the emulator below.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 64-bit only (Droidtop/tracker#646): a 32-bit build stops at an #error in lockdown.c.
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Build with the NDK
        run: |
          cmake -S . -B build             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26
          cmake --build build -j

  android-emulator:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Build with the NDK
        run: |
          cmake -S . -B build             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26
          cmake --build build -j
          cp build/sbx_test build/gpu_probe build/libsbx_child.so build/sbx-exec .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # The GPU probe is a measurement, not a gate: its output is the answer (see tests/android/gpu_probe.c).
          script: |
            adb push sbx_test gpu_probe libsbx_child.so sbx-exec /data/local/tmp/
            adb shell 'uname -a; cat /proc/sys/kernel/seccomp/actions_avail; cd /data/local/tmp && chmod 755 sbx_test gpu_probe sbx-exec && TMPDIR=/data/local/tmp ./sbx_test; echo "exit=$?"' | tee result.txt
            # A test process that dies by a signal leaves its reason here (debuggerd, seccomp audit).
            adb logcat -d | grep -iE 'sbx_test|sbx-exec|F DEBUG|type=1326' | tail -60 || true
            adb logcat -c || true
            adb shell 'cd /data/local/tmp && ./gpu_probe; echo "probe_exit=$?"' || true
            adb shell 'cd /data/local/tmp && ./gpu_probe --no-seal; echo "probe_exit=$?"' || true
            adb logcat -d | grep -iE 'gpu_probe|binder|gralloc|mapper|F DEBUG|F libc|seccomp|avc' | tail -60 || true
            grep -q '^exit=0' result.txt

  probe-binaries:
    # The test and the GPU probe for both ABIs, as a rolling prerelease, so a rig or a console
    # window can run them with adb without building anything (see docs/design.md, "Testing").
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [android-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build both ABIs
        run: |
          for abi in arm64-v8a x86_64; do
            cmake -S . -B "build-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26
            cmake --build "build-$abi" -j
            cp "build-$abi/sbx_test" "sbx_test-$abi"
            cp "build-$abi/gpu_probe" "gpu_probe-$abi"
            mkdir -p "child-$abi" && cp "build-$abi/libsbx_child.so" "child-$abi/libsbx_child.so"
            (cd "child-$abi" && zip -q "../libsbx_child-$abi.zip" libsbx_child.so)
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view probe-latest >/dev/null 2>&1 || \
            gh release create probe-latest --prerelease --title "Test and GPU probe binaries (rolling)" \
              --notes "Built from main by CI. Rebuilt on every push; see the commit in the asset upload time."
          gh release upload probe-latest sbx_test-* gpu_probe-* libsbx_child-*.zip --clobber
          gh release edit probe-latest --notes "Built from ${GITHUB_SHA} by CI run ${GITHUB_RUN_ID}."

  release:
    # A tagged release for each version in CMakeLists.txt, made once, after every test job passed on
    # main. Consumers pin the tag (Droidtop/tracker#584). The notes are the README's entry for it.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [linux, linux-arm64, windows, android-build, android-emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release the version if it has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^project(sandbox VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          test -n "$version" || { echo "no version in CMakeLists.txt"; exit 1; }
          grep -q "^#define SBX_VERSION \"$version\"" include/sbx.h || { echo "sbx.h's SBX_VERSION is not $version"; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is released already"
            exit 0
          fi
          awk -v head="- **v$version**" '
            index($0, head) == 1 { on = 1; print; next }
            on && (/^- \*\*v/ || /^#/) { exit }
            on { print }' README.md > notes.md
          test -s notes.md || { echo "README.md has no entry for v$version"; exit 1; }
          printf '\nBuilt and tested by CI run %s.\n' "$GITHUB_RUN_ID" >> notes.md
          # A tag made by hand (the coordinator tags on request) is released as it stands, never moved.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            gh release create "v$version" --verify-tag --title "sandbox $version" --notes-file notes.md
          else
            gh release create "v$version" --target "$GITHUB_SHA" --title "sandbox $version" --notes-file notes.md
          fi
