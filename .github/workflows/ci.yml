name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.runner }} ${{ matrix.cc }}${{ matrix.sanitize == 'ON' && ' asan+ubsan' || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
        cc: [gcc, clang]
        sanitize: [OFF]
        include:
          - runner: ubuntu-24.04
            cc: clang
            sanitize: ON
    steps:
      - uses: actions/checkout@v4
      - name: Kernel
        run: uname -a; cat /proc/sys/kernel/seccomp/actions_avail
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DSBX_SANITIZE=${{ matrix.sanitize }}
          cmake --build build -j
      - name: Test
        env:
          # LeakSanitizer stops the world with ptrace, which the lockdown refuses.
          ASAN_OPTIONS: detect_leaks=0
        run: TMPDIR="$RUNNER_TEMP" ./build/sbx_test

  linux-arm64:
    # Arm runners are free for public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j
      - name: Test
        run: TMPDIR="$RUNNER_TEMP" ./build/sbx_test

  android-build:
    # Compiles for every Android ABI (tests for the 64-bit ones); the x86_64 build also runs on the emulator below.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The 32-bit ABIs build (the lockdown answers ENOSYS there): a host that ships them still links the library.
        abi: [arm64-v8a, x86_64, armeabi-v7a, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Build with the NDK
        run: |
          cmake -S . -B build             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 -DSBX_TESTS=${{ (matrix.abi == 'armeabi-v7a' || matrix.abi == 'x86') && 'OFF' || 'ON' }}
          cmake --build build -j

  android-emulator:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Build with the NDK
        run: |
          cmake -S . -B build             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26
          cmake --build build -j
          cp build/sbx_test build/gpu_probe .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # The GPU probe is a measurement, not a gate: its output is the answer (see tests/android/gpu_probe.c).
          script: |
            adb push sbx_test gpu_probe /data/local/tmp/
            adb shell 'uname -a; cat /proc/sys/kernel/seccomp/actions_avail; cd /data/local/tmp && chmod 755 sbx_test gpu_probe && TMPDIR=/data/local/tmp ./sbx_test; echo "exit=$?"' | tee result.txt
            adb logcat -c || true
            adb shell 'cd /data/local/tmp && ./gpu_probe; echo "probe_exit=$?"' || true
            adb shell 'cd /data/local/tmp && ./gpu_probe --no-seal; echo "probe_exit=$?"' || true
            adb logcat -d | grep -iE 'gpu_probe|binder|gralloc|mapper|F DEBUG|F libc|seccomp|avc' | tail -60 || true
            grep -q '^exit=0' result.txt

  probe-binaries:
    # The test and the GPU probe for both ABIs, as a rolling prerelease, so a rig or a console
    # window can run them with adb without building anything (see docs/design.md, "Testing").
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [android-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build both ABIs
        run: |
          for abi in arm64-v8a x86_64; do
            cmake -S . -B "build-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-26
            cmake --build "build-$abi" -j
            cp "build-$abi/sbx_test" "sbx_test-$abi"
            cp "build-$abi/gpu_probe" "gpu_probe-$abi"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view probe-latest >/dev/null 2>&1 || \
            gh release create probe-latest --prerelease --title "Test and GPU probe binaries (rolling)" \
              --notes "Built from main by CI. Rebuilt on every push; see the commit in the asset upload time."
          gh release upload probe-latest sbx_test-* gpu_probe-* --clobber
          gh release edit probe-latest --notes "Built from ${GITHUB_SHA} by CI run ${GITHUB_RUN_ID}."
